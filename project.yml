name: CaptionTranslator
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.33.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  CaptionTranslator:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 자막번역
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 같은 네트워크의 서브컴에서 자막을 받아옵니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.captiontranslator.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CaptionTranslator:
    build:
      targets:
        CaptionTranslator: all
