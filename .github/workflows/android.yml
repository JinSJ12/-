name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 빌드마다 서명 키가 바뀌면 덮어 설치가 안 되므로 같은 키를 다시 씁니다.
      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android --no-daemon :app:assembleDebug 2>&1 | tee gradle.log

      # 실패하면 오류 줄을 실행 화면의 Annotations에 보여줍니다.
      - name: Report build errors
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          grep -E -A3 '^e: |error:|What went wrong' gradle.log | head -n 20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CaptionTranslator.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CaptionTranslator-apk
          path: out/CaptionTranslator.apk
          if-no-files-found: error
